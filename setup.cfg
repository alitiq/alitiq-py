[metadata]
name = alitiq
version = 2026.10.15
author = Daniel Lassahn | alitiq GmbH
author_email = info@alitiq.com
description = Python SDK for solar PV, wind power and energy load forecasting with the alitiq forecast API
long_description = file: README.md
long_description_content_type = text/markdown
url = https://alitiq.com
project_urls =
    Homepage = https://alitiq.com
    Documentation = https://docs.alitiq.com
    Source = https://github.com/alitiq/alitiq-py
    Issue Tracker = https://github.com/alitiq/alitiq-py/issues
    Solar PV Forecast = https://alitiq.com/en/products/solar-pv
    Wind Power Forecast = https://alitiq.com/en/products/wind-power
    Load Forecast = https://alitiq.com/en/products/energyload
keywords = energy, forecasting, solar, pv, photovoltaic, solar power forecast, pv forecast, wind, wind power forecast, windpower, solarpower, load forecast, demand forecast, energy forecasting, renewable energy, power prediction, satellite irradiance, pv simulation, api, sdk
license = MIT License (covers only the code of alitiq-py)
classifiers =
        Development Status :: 5 - Production/Stable
        Intended Audience :: Developers
        Intended Audience :: Science/Research
        Programming Language :: Python :: 3
        Programming Language :: Python :: 3.10
        Programming Language :: Python :: 3.11
        Programming Language :: Python :: 3.12
        Programming Language :: Python :: 3.13
        Operating System :: OS Independent
        Topic :: Scientific/Engineering
        Topic :: Scientific/Engineering :: Atmospheric Science
        Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
zip_safe = True
include_package_data = False
python_requires = >=3.10
install_requires =
    pandas>=2.0
    pydantic>=2.0,<3
    requests>=2.28
